# /etc/nginx/sites-available/genzyclub.conf
# Cloudflare real-IP ranges: generate /etc/nginx/cloudflare-ips.conf with deploy/cloudflare-ips.sh
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=order:10m rate=10r/m;

server {
  listen 443 ssl;
  http2 on;
  server_name genzyclub.tech;
  ssl_certificate     /etc/ssl/cloudflare/genzyclub.pem;
  ssl_certificate_key /etc/ssl/cloudflare/genzyclub.key;
  client_max_body_size 30m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /uploads/ {
    alias /var/www/genzyclub/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /admin/login {
    limit_req zone=login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/genzy-proxy.conf;
  }
  location = /api/checkout/order {
    limit_req zone=order burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/genzy-proxy.conf;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/genzy-proxy.conf;
  }
}
server { listen 80; server_name genzyclub.tech www.genzyclub.tech; return 301 https://genzyclub.tech$request_uri; }
server {
  listen 443 ssl;
  http2 on;
  server_name www.genzyclub.tech;
  ssl_certificate     /etc/ssl/cloudflare/genzyclub.pem;
  ssl_certificate_key /etc/ssl/cloudflare/genzyclub.key;
  return 301 https://genzyclub.tech$request_uri;
}
